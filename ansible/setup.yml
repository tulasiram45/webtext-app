---
- name: Configure webtext application VM

  hosts: all
  become: true

  vars:
    app_directory: /opt/webtext-app
    git_repository: "https://github.com/tulasiram45/webtext-app.git"

  tasks:

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - docker.io
          - curl
          - ca-certificates
          - gnupg
          - git
        state: present

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to Docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Install Task
      shell: |
        sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      args:
        creates: /usr/local/bin/task

    - name: Install Doppler CLI
      shell: |
        curl -Ls https://cli.doppler.com/install.sh | sh
      args:
        creates: /usr/bin/doppler

    - name: Verify Docker
      command: docker --version
      changed_when: false

    - name: Verify Task
      command: task --version
      changed_when: false

    - name: Verify Doppler
      command: doppler --version
      changed_when: false

    - name: Configure Doppler token in bashrc
      ansible.builtin.lineinfile:
        path: /root/.bashrc
        line: 'export DOPPLER_TOKEN="{{ doppler_token }}"'
        create: true
      no_log: true


    # 7. Clone Git repository
    - name: Clone webtext application
      become: true
      git:
        repo: "{{ git_repository }}"
        dest: "{{ app_directory }}"
        version: main
        force: yes

    # 8. Build Docker image
    - name: Build Docker image
      become: true
      command: task build
      args:
        chdir: "{{ app_directory }}"

    # 9. Lint Dockerfile
    - name: Lint Dockerfile
      become: true
      command: task lint
      args:
        chdir: "{{ app_directory }}"

    # 10. Deploy application
    - name: Deploy webtext application
      become: true
      command: task deploywithdoppler
      args:
        chdir: "{{ app_directory }}"
      environment:
        DOPPLER_TOKEN: "{{ doppler_token }}"

    # 11. Test application
    - name: Test deployed application
      become: true
      command: task testdoppler
      args:
        chdir: "{{ app_directory }}"
