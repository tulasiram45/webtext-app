version: '3'

vars:
  IMAGE: webtext-app
  CONTAINER: webtext-app
  PORT: 8081

tasks:

  build:
    desc: Build Docker image
    cmds:
      - docker build -t {{.IMAGE}}:latest .

  lint:
    desc: Lint Dockerfile using Hadolint
    cmds:
      - docker run --rm -i hadolint/hadolint < Dockerfile

  deploy:
    desc: Deploy application with Development deploy text
    cmds:
      - docker rm -f {{.CONTAINER}} || true
      - |
        docker run -d \
          --name {{.CONTAINER}} \
          -p {{.PORT}}:80 \
          -e WEBTEXT="Development deploy" \
          --restart unless-stopped \
          {{.IMAGE}}:latest

  test:
    desc: Test application response
    cmds:
      - |
        RESPONSE=$(curl -fsS http://localhost:{{.PORT}})
        echo "Response: $RESPONSE"
        test "$RESPONSE" = "Development deploy"
        echo "TEST PASSED"

  clean:
    desc: Stop and remove container
    cmds:
      - docker stop {{.CONTAINER}} || true
      - docker rm {{.CONTAINER}} || true

  cicd:
    desc: Build, lint, deploy and test
    deps:
      - build
      - lint
    cmds:
      - task: deploy
      - task: test


  deploywithdoppler:
    desc: Deploy application using Doppler secrets
    cmds:
      - |
        set -eu

        if [ -z "${DOPPLER_TOKEN:-}" ]; then
          echo "ERROR: DOPPLER_TOKEN is not set"
          exit 1
        fi

        doppler run --project webtext-app --config dev -- bash -c '
          set -eu
          : "${WEBTEXT:?WEBTEXT is missing in Doppler}"

          docker rm -f webtext-app || true

          docker run -d \
            --name webtext-app \
            --restart unless-stopped \
            -p 8081:80 \
            -e WEBTEXT="$WEBTEXT" \
            webtext-app:latest
        '

      - |
        set -eu
        for i in $(seq 1 15); do
          if curl -fsS http://localhost:8081 >/dev/null; then
            echo "Doppler application is ready"
            exit 0
          fi
          sleep 2
        done

        echo "Application failed to start"
        docker logs webtext-app
        exit 1

      - task: testdoppler

  testdoppler:
    desc: Verify Doppler deployment
    cmds:
      - |
        set -eu

        EXPECTED="Hello World from Doppler!"
        RESPONSE="$(curl -fsS http://localhost:8081)"

        echo "Expected: ${EXPECTED}"
        echo "Actual: ${RESPONSE}"

        test "${RESPONSE}" = "${EXPECTED}"

        echo "DOPPLER TEST PASSED"
